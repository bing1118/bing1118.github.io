<script>
'use strict';
/* =========================================================
   奶龙2048：经典 2048 + 奶龙进化图鉴 + 乱斗随机事件
   贴图素材：YHSome/BigNaiWa (assets/fruits, 11 张)
   ========================================================= */
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const $=id=>document.getElementById(id);

/* ---------- 音效 ---------- */
let AC=null, muted=localStorage.getItem('nl_mute')==='1';
function audioInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(f,d,type='sine',v=.35,slide=0,delay=0){
  if(!AC||muted) return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
  g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d+.02);
}
function noiseBurst(dur=.25,vol=.3){
  if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(), g=AC.createGain();
  src.buffer=buf; g.gain.value=vol; src.connect(g); g.connect(AC.destination); src.start();
}
const sfx={
  slide(){ tone(160,.06,'sine',.18); },
  merge(t){ tone(200*Math.pow(1.13,t),.12,'square',.3); tone(400*Math.pow(1.13,t),.08,'sine',.2,0,.04); },
  boing(){ tone(620,.16,'square',.3,420); tone(920,.2,'square',.22,-560,.1); },
  boom(){ tone(140,.4,'sawtooth',.45,-80); noiseBurst(.25,.3); },
  combo(n){ [0,1,2].slice(0,Math.min(3,n-1)).forEach(i=>tone(520+i*140,.1,'square',.3,0,i*.07)); },
  shiny(){ [880,1108,1318,1760].forEach((f,i)=>tone(f,.14,'triangle',.32,0,i*.07)); },
  event(){ tone(523,.12,'triangle',.3); tone(784,.16,'triangle',.3,0,.09); },
  unlock(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.18,'triangle',.32,0,i*.08)); },
  over(){ tone(300,.5,'sawtooth',.4,-200); },
  hiccup(){ tone(520,.09,'square',.3,300); tone(700,.09,'square',.28,-380,.11); },
  oops(){ tone(400,.18,'sine',.28,-180); tone(300,.2,'sine',.24,-140,.12); },
};

/* ---------- 奶龙台词库（按场景随机吐槽） ---------- */
const QUIPS={
  tier:['咦哩，又变大了','快飞升了','咕咕咕','稳住，能赢','今天也很努力','挤挤更健康','别拍了别拍了','这只在装成熟','刚刚那下有点晕','我是谁我在哪'],
  combo:['妙啊','这波不亏','叠罗汉','手气来了','奶龙排队入职','越挤越开心','排队！都排队！'],
  boom:['奶龙挤压过载！','这只奶龙爆了','挤爆了挤爆了','大型奶龙合并现场','唔哇！','消防队吗，这里奶龙炸了','它爆得很体面'],
  none:['一下都没合上，奶龙们面面相觑','手滑了？奶龙们假装没看见','这步走得很有想法，但毫无作用','全场奶龙无话可说','奶龙们等这步等得打哈欠','刚才那一下，空气都安静了'],
  idle:['奶龙们等得打起了瞌睡','有只奶龙开始数格子玩','奶龙提议：要不就先这样？','咕咕咕……（奶龙肚子在叫）'],
};

/* ---------- 进化链（11 张贴图 = 11 级） ---------- */
const TIERS=[
  {v:2,    img:'img/tier-02.png',      name:'奶龙蛋',     bg:'linear-gradient(155deg,#fdf8ea,#ece0c2)', fg:'#6b5a2e'},
  {v:4,    img:'img/tier-04.png',     name:'小奶龙',     bg:'linear-gradient(155deg,#fdf1cf,#f2dda2)', fg:'#6b5426'},
  {v:8,    img:'img/tier-08.png',     name:'大耳龙',     bg:'linear-gradient(155deg,#ffeab6,#f5cf7e)', fg:'#6b4f1e'},
  {v:16,   img:'img/tier-16.png',      name:'鸡王龙',     bg:'linear-gradient(155deg,#ffe09e,#f4bd60)', fg:'#5f431a'},
  {v:32,   img:'img/tier-32.png',       name:'奶龙犬',     bg:'linear-gradient(155deg,#ffd287,#f0a752)', fg:'#54391a'},
  {v:64,   img:'img/tier-64.png',     name:'天使龙',     bg:'linear-gradient(155deg,#ffbe7d,#ea914a)', fg:'#4d3018'},
  {v:128,  img:'img/tier-128.png',      name:'奶龙马',     bg:'linear-gradient(155deg,#fba266,#dd7438)', fg:'#fff6e6'},
  {v:256,  img:'img/tier-256.png',  name:'叉腰龙',     bg:'linear-gradient(155deg,#ef8655,#c95a2e)', fg:'#fff6e6'},
  {v:512,  img:'img/tier-512.png',    name:'舞王龙',     bg:'linear-gradient(155deg,#e06a45,#a63a20)', fg:'#ffe9c9'},
  {v:1024, img:'img/tier-1024.png',  name:'狂笑龙',     bg:'linear-gradient(155deg,#453760,#241c3a)', fg:'#ffd76a'},
  {v:2048, img:'img/tier-2048.png', name:'飞升神奶龙', bg:'linear-gradient(155deg,#5a4420,#1f1808)', fg:'#ffd76a'},
];
const tierOf = v => TIERS.find(t=>t.v===v) || TIERS[TIERS.length-1];

/* ---------- 状态 ---------- */
let g2, g2Best=+(localStorage.getItem('nl2_best')||0);
let g2Unlock=2;   /* 已点亮的最大等级 */
(function loadUnlock(){
  const saved=JSON.parse(localStorage.getItem('nl2_dex')||'[2]');
  g2Unlock = Math.max(...saved);
})();
let g2ModeOn = localStorage.getItem('nl2_chaos')!=='0';
$('g2BestPill').textContent=g2Best;
$('g2Mode').textContent = g2ModeOn?'乱斗：开':'乱斗：关';
$('g2DexPill').textContent = TIERS.filter(t=>t.v<=g2Unlock).length+'/'+TIERS.length;

/* ---------- 每局随机祝福 Buff ---------- */
const BUFFS=[
  {id:'gift',  name:'天降奶龙',  desc:'开局多给一只四级奶龙'},
  {id:'shiny', name:'富贵险中求', desc:'这局闪光奶龙出现得更多'},
  {id:'fast',  name:'事件狂热',  desc:'这局乱斗事件改成每八步一件'},
  {id:'egg',   name:'蛋蛋好运',  desc:'这局新蛋几乎都是二级，容易连成一串'},
];
function drawBuff(){
  return BUFFS[ri(0,BUFFS.length-1)];
}

function saveDex(){
  const got=TIERS.filter(t=>t.v<=g2Unlock).map(t=>t.v);
  localStorage.setItem('nl2_dex', JSON.stringify(got));
  $('g2DexPill').textContent = got.length+'/'+TIERS.length;
}

/* ---------- 棋盘 ---------- */
function g2BoardInit(){
  const b=$('g2board'); b.innerHTML='';
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const d=document.createElement('div'); d.className='g2cell';
    d.style.left=(8+c*112)+'px'; d.style.top=(8+r*112)+'px';
    d.style.width='104px'; d.style.height='104px';
    b.appendChild(d);
  }
}
function g2New(silent){
  g2={grid:Array.from({length:4},()=>Array(4).fill(null)), score:0, moves:0, lucky:0,
      over:false, won:false, maxV:2, rescues:0,
      fourChance:.1, shinyRate:.08, chaosEvery:10, forceShiny:false,
      ach:{}, buff:null};
  $('ov-g2-over').classList.remove('show');
  $('g2RescuePill').style.display='none';
  g2Add(); g2Add();
  /* 每局随机祝福 */
  g2.buff = drawBuff();
  if(g2.buff.id==='gift')  g2Add(4);
  if(g2.buff.id==='shiny') g2.shinyRate = .16;
  if(g2.buff.id==='fast')  g2.chaosEvery = 8;
  if(g2.buff.id==='egg')   g2.fourChance = .02;
  if(!silent) banner('这局祝福 '+g2.buff.name+'，'+g2.buff.desc);
  g2Render();
}
function g2Add(forceV){
  const empty=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!g2.grid[r][c]) empty.push({r,c});
  if(!empty.length) return;
  const {r,c}=empty[ri(0,empty.length-1)];
  const isShiny = g2.forceShiny || Math.random() < (g2.shinyRate??.08);
  g2.forceShiny = false;
  g2.grid[r][c]={v: forceV || (Math.random() < (g2.fourChance??.1) ? 4 : 2), pop:true, shiny:isShiny};
  if(isShiny) g2.shinySpawn={r,c};
}
function g2Render(){
  const b=$('g2board');
  b.querySelectorAll('.tile').forEach(t=>t.remove());
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const cell=g2.grid[r][c];
    if(!cell) continue;
    const t=tierOf(cell.v);
    const el=document.createElement('div');
    let cls='tile'+(cell.pop?' pop':' squish');
    if(cell.hiccup){ cls='tile hic'; cell.hiccup=false; }
    if(g2.circus){ cls='tile circus'; el.style.animationDelay=((r*4+c)*38)+'ms'; }
    el.className=cls+(cell.gift?' gift':'')+(cell.v>=2048?' max':'')+(cell.shiny?' shiny':'');
    el.style.left=(8+c*112)+'px'; el.style.top=(8+r*112)+'px';
    el.style.width='104px'; el.style.height='104px';
    el.style.background=t.bg;
    el.style.transform='rotate('+(Math.random()*5-2.5).toFixed(1)+'deg)';
    const img=document.createElement('img');
    img.src=t.img; img.alt=''; img.draggable=false;
    el.appendChild(img);
    b.appendChild(el);
    cell.pop=false; cell.gift=false;
  }
  $('g2ScorePill').textContent=g2.score;
  $('g2BestPill').textContent=g2Best;
}

/* ---------- 图鉴 ---------- */
function g2CheckUnlock(v){
  if(v>g2Unlock){
    const t=tierOf(v);
    g2Unlock=v; saveDex();
    sfx.unlock();
    toast('图鉴点亮：'+v+' '+t.name);
    renderDex();
  }
}
function renderDex(){
  const box=$('dex'); box.innerHTML='';
  TIERS.forEach(t=>{
    const d=document.createElement('div');
    const unlocked=t.v<=g2Unlock;
    d.className='dexcell '+(unlocked?'unlocked':'locked')+(t.v===g2Unlock&&unlocked?' hot':'');
    if(unlocked){
      const img=document.createElement('img'); img.src=t.img; img.alt=t.name; img.draggable=false;
      d.appendChild(img);
    } else {
      const q=document.createElement('span'); q.textContent='?';
      q.style.fontSize='28px'; q.style.display='inline-block'; q.style.height='44px'; q.style.lineHeight='44px';
      d.appendChild(q);
    }
    const dv=document.createElement('span'); dv.className='dv'; dv.textContent=t.v;
    d.appendChild(dv);
    box.appendChild(d);
  });
}

/* ---------- 移动与合并 ---------- */
function g2Slide(vals){
  const out=[]; let gained=0; const merges=[]; let i=0;
  while(i<vals.length){
    if(i+1<vals.length && vals[i].v===vals[i+1].v){
      const nv=vals[i].v*2;
      const shiny = !!(vals[i].shiny || vals[i+1].shiny);
      let pts = nv * (g2.lucky>0?2:1);
      if(g2.lucky>0) g2.lucky--;
      if(shiny) pts += nv*4;              /* 闪光奶龙：该次合成共 ×5 */
      gained += pts;
      out.push({v:nv, merged:true, pop:true});
      merges.push({v:nv, shiny});
      i+=2;
    } else { out.push({v:vals[i].v, shiny:vals[i].shiny}); i++; }
  }
  while(out.length<4) out.push(null);
  return {out, gained, merges};
}
function g2Move(dx,dy){
  if(!g2 || g2.over) return;
  let moved=false, gained=0, comboN=0, shinyHit=0, maxMerged=0;
  const spots=[];
  for(let line=0;line<4;line++){
    const cells=[];
    for(let k=0;k<4;k++){
      const r = dy===1?3-k : dy===-1?k : line;
      const c = dx===1?3-k : dx===-1?k : line;
      cells.push([r,c]);
    }
    const vals=cells.map(([r,c])=>g2.grid[r][c]).filter(Boolean);
    const {out,gained:g,merges}=g2Slide(vals);
    gained+=g; comboN+=merges.length;
    shinyHit += merges.filter(m=>m.shiny).length;
    let mi=0;
    cells.forEach(([r,c],idx)=>{
      const nv=out[idx]||null, old=g2.grid[r][c];
      if((!!nv)!==(!!old) || (nv&&old&&nv.v!==old.v)) moved=true;
      g2.grid[r][c]=nv?{...nv}:null;
      if(nv && nv.merged && merges[mi]){ spots.push({r,c,v:nv.v,shiny:merges[mi].shiny}); maxMerged=Math.max(maxMerged,nv.v); mi++; }
    });
  }
  if(!moved) return;
  /* 连击：一次滑动合并越多，倍率越高 */
  let comboMult=1;
  if(comboN>=4) comboMult=3; else if(comboN===3) comboMult=2; else if(comboN===2) comboMult=1.5;
  gained = Math.round(gained*comboMult);
  g2.score+=gained; g2.moves++;
  g2Add();
  let mx=0;
  for(const row of g2.grid) for(const c of row) if(c) mx=Math.max(mx,c.v);
  g2.maxV=Math.max(g2.maxV,mx);
  g2CheckUnlock(mx);
  let eventFired=false;
  if(g2ModeOn && g2.moves % (g2.chaosEvery||10) === 0){ g2Chaos(); eventFired=true; }
  if(g2.score>g2Best){ g2Best=g2.score; localStorage.setItem('nl2_best',g2Best); }
  g2Render();
  animFit(dx===1?'nudge-r':dx===-1?'nudge-l':dy===1?'nudge-d':'nudge-u');
  if(gained>0) sfx.merge(Math.log2(mx)); else sfx.slide();
  /* ---------- 趣味反馈 ---------- */
  renderFx(spots, comboN, comboMult, shinyHit, maxMerged, eventFired);
  if(comboN===0 && !eventFired && Math.random()<.16){
    banner(QUIPS.none[ri(0,QUIPS.none.length-1)]);
    sfx.oops();
  }
  g2.miss=comboN===0 ? (g2.miss||0)+1 : 0;
  if(g2.miss===3 && !g2.ach.miss3){ g2.ach.miss3=true; toast('成就：连着三步啥也没合上'); }
  g2.lastAct=Date.now(); g2.idleShown=false;
  if(!g2CanMove()){
    if(g2RescueOn){ g2Rescue(); }
    else { g2.over=true; sfx.over(); setTimeout(()=>g2OverShow(false),450); }
  }
  if(mx>=2048 && !g2.won){ g2.won=true; setTimeout(()=>g2OverShow(true),450); }
}
/* ---------- 🛟 救援模式：卡死不死，随机救场 ---------- */
let g2RescueOn = localStorage.getItem('nl2_rescue')!=='0';
function g2Rescue(){
  g2.rescues = (g2.rescues||0)+1;
  $('g2RescuePill').style.display='';
  $('g2RescueN').textContent=g2.rescues;
  const roll = ri(0,2);
  if(roll===0){
    /* 吃掉全场最小的奶龙 */
    let mn=Infinity;
    for(const row of g2.grid) for(const c of row) if(c) mn=Math.min(mn,c.v);
    for(let r=0;r<4;r++) for(let c=0;c<4;c++)
      if(g2.grid[r][c] && g2.grid[r][c].v===mn){ burstAt(r,c); g2.grid[r][c]=null; }
    banner('奶龙饿了，把 '+mn+' 级的全吃掉了');
  } else if(roll===1){
    /* 卷走最挤的一行 */
    let best=0, bi=0;
    for(let r=0;r<4;r++){
      const n=g2.grid[r].filter(Boolean).length;
      if(n>best){ best=n; bi=r; }
    }
    for(let c=0;c<4;c++) if(g2.grid[bi][c]) burstAt(bi,c);
    g2.grid[bi]=Array(4).fill(null);
    banner('一阵风把第 '+(bi+1)+' 行卷走了');
  } else {
    /* 捣蛋龙踩小三只 */
    const cands=[];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(g2.grid[r][c] && g2.grid[r][c].v>2) cands.push([r,c]);
    for(let i=0;i<3 && cands.length;i++){
      const k=ri(0,cands.length-1);
      const [r,c]=cands.splice(k,1)[0];
      g2.grid[r][c]={v:g2.grid[r][c].v/2, pop:true};
    }
    banner('捣蛋龙把几只踩小了，腾出点地方');
  }
  /* 兜底：还有卡死就再吃一次（清行/清最小值必然留空位） */
  if(!g2CanMove()){
    let mn=Infinity;
    for(const row of g2.grid) for(const c of row) if(c) mn=Math.min(mn,c.v);
    for(let r=0;r<4;r++) for(let c=0;c<4;c++)
      if(g2.grid[r][c] && g2.grid[r][c].v===mn) g2.grid[r][c]=null;
  }
  sfx.event();
  g2Render();
}
/* 粒子爆发（圆点，棋盘坐标） */
function burstAt(r,c,colors,n){
  colors = colors || ['#e8c9a0','#f2c255','#fff7e0'];
  n = n || 6;
  const fit=$('g2fit');
  const cx=8+c*112+20, cy=8+r*112+20;
  for(let i=0;i<n;i++){
    const pt=document.createElement('div'); pt.className='fxp';
    pt.style.left=cx+'px'; pt.style.top=cy+'px';
    pt.style.background=colors[i%colors.length];
    fit.appendChild(pt);
    const a=Math.random()*Math.PI*2, d=26+Math.random()*58;
    try{
      pt.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-16)+'px) scale(.35)',opacity:0}],{duration:440+Math.random()*220,easing:'cubic-bezier(.1,.8,.3,1)'}).finished.then(()=>pt.remove()).catch(()=>pt.remove());
    }catch(e){ setTimeout(()=>pt.remove(),500); }
  }
}
function confetti(n){
  const fit=$('g2fit');
  const palette=['#ff8fb5','#8fd16a','#5ab2ff','#ffd23a','#f2c255'];
  const h=fit.clientHeight||456;
  for(let i=0;i<n;i++){
    const pt=document.createElement('div'); pt.className='fxp';
    pt.style.left=ri(4,92)+'%'; pt.style.top='-8px';
    pt.style.background=palette[i%palette.length];
    fit.appendChild(pt);
    const drift=ri(-40,40);
    try{
      pt.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+drift+'px,'+(h+24)+'px) rotate('+ri(-220,220)+'deg)',opacity:.2}],{duration:650+Math.random()*450,easing:'cubic-bezier(.2,.6,.4,1)'}).finished.then(()=>pt.remove()).catch(()=>pt.remove());
    }catch(e){ setTimeout(()=>pt.remove(),1100); }
  }
}

      pt.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-16)+'px) scale(.35)',opacity:0}],{duration:440+Math.random()*220,easing:'cubic-bezier(.1,.8,.3,1)'}).finished.then(()=>pt.remove()).catch(()=>pt.remove());
    }catch(e){ setTimeout(()=>pt.remove(),500); }

function burstCandy(r,c,n){
  const fit=$('g2fit');
  const cx=8+c*112+20, cy=8+r*112+20;
  const palette=['#ff8fb5','#8fd16a','#5ab2ff','#ffd23a'];

      pt.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-20)+'px) scale(.4)',opacity:0}],{duration:520+Math.random()*240,easing:'cubic-bezier(.1,.8,.3,1)'}).finished.then(()=>pt.remove()).catch(()=>pt.remove());
    }catch(e){ setTimeout(()=>pt.remove(),600); }

}
function randomWiggle(){
  const tiles=document.querySelectorAll('#g2board .tile');
  if(!tiles.length) return;
  const t=tiles[ri(0,tiles.length-1)];
  t.classList.remove('wiggle'); void t.offsetWidth; t.classList.add('wiggle');
  setTimeout(()=>t.classList.remove('wiggle'),900);
}
function renderFx(spots, comboN, comboMult, shinyHit, maxMerged, eventFired){
  const gained_ok = spots.length>0 || comboN>0;
  const line=$('floatline'); line.innerHTML='';
  spots.slice(0,5).forEach(s=>{
    burstAt(s.r, s.c, s.shiny?['#ffd76a','#ffffff','#e2a233']:['#e8c9a0','#f2c255','#fff7e0'], s.shiny?12:(s.v>=256?10:6));
  });
  if(g2.shinySpawn){ burstAt(g2.shinySpawn.r, g2.shinySpawn.c, ['#ffd76a','#ffffff','#f2d98a'], 7); g2.shinySpawn=null; }
  spots.slice(0,5).forEach(s=>{
    const f=document.createElement('span');
    f.className='floatscore'+(s.shiny||s.v>=128?' big':'');
    f.textContent='+'+s.v;
    line.appendChild(f);
    setTimeout(()=>f.remove(),950);
  });
  if(comboN>=2){
    const pill=$('g2Combo');
    pill.textContent='连合 ×'+comboN+(comboMult>1?'，加'+Math.round((comboMult-1)*100)+'%':'');
    pill.classList.add('show');
    clearTimeout(pill._t); pill._t=setTimeout(()=>pill.classList.remove('show'),1600);
    if(!eventFired) banner('连合 ×'+comboN+'，'+QUIPS.combo[ri(0,QUIPS.combo.length-1)]);
    sfx.combo(comboN);
    if(comboN>=3 && !g2.ach.combo3){ g2.ach.combo3=true; toast('成就：单步连合 ×'+comboN); }
  } else {
    $('g2Combo').classList.remove('show');
  }
  if(shinyHit>0){
    spots.filter(s=>s.shiny).slice(0,2).forEach(s=>burstCandy(s.r, s.c, 9));
    sfx.shiny();
    if(!eventFired) banner('合掉了闪光奶龙，这一下算五倍分');
    if(!g2.ach.shiny){ g2.ach.shiny=true; toast('成就：第一次合掉闪光奶龙'); }
  }
  if(maxMerged>=64){
    animFit('shake');
    if(!eventFired && !shinyHit && comboN<2 && Math.random()<.5)
      banner('奶龙：'+QUIPS.tier[ri(0,QUIPS.tier.length-1)]);
  }
  if(maxMerged>=512){
    const bf=$('bflash'); bf.classList.remove('on'); void bf.offsetWidth; bf.classList.add('on');
    spots.forEach(s=>burstAt(s.r, s.c, ['#ffd76a','#ffffff','#e2a233'], s.v>=1024?14:9));
    sfx.boom(); if(maxMerged>=1024) sfx.boing();
    if(!eventFired && Math.random()<.75) banner(QUIPS.boom[ri(0,QUIPS.boom.length-1)]);
  }
  if(comboN>=3 || maxMerged>=512) confetti(10 + comboN*3 + (maxMerged>=512?8:0));
  if(spots.length && maxMerged<64 && !eventFired && Math.random()<.12)
    banner('奶龙：'+QUIPS.tier[ri(0,QUIPS.tier.length-1)]);
  if(gained_ok && Math.random()<.14) randomWiggle();
  if(!g2.ach.s1000 && g2.score>=1000){ g2.ach.s1000=true; toast('成就：分数过千'); }
  if(!g2.ach.s5000 && g2.score>=5000){ g2.ach.s5000=true; toast('成就：分数过了五千'); }
}
function g2CanMove(){
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    if(!g2.grid[r][c]) return true;
    const v=g2.grid[r][c].v;
    if(c<3 && g2.grid[r][c+1] && g2.grid[r][c+1].v===v) return true;
    if(r<3 && g2.grid[r+1][c] && g2.grid[r+1][c].v===v) return true;
  }
  return false;
}

/* ---------- 乱斗事件 ---------- */
function g2Chaos(){
  const roll=ri(0,12);
  if(roll===0){
    g2Add(4);
    for(const row of g2.grid) for(const c of row) if(c&&c.pop) c.gift=true;
    banner('空投了一只四级的');
  } else if(roll===1){
    const r=ri(0,3);
    const vals=g2.grid[r].filter(Boolean).map(c=>c.v);
    for(let i=vals.length-1;i>0;i--){ const j=ri(0,i); [vals[i],vals[j]]=[vals[j],vals[i]]; }
    g2.grid[r]=vals.map(v=>({v}));
    banner('第 '+(r+1)+' 行被搅乱了');
  } else if(roll===2){
    const cands=[];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(g2.grid[r][c] && g2.grid[r][c].v>2) cands.push([r,c]);
    if(cands.length){
      const [r,c]=cands[ri(0,cands.length-1)];
      g2.grid[r][c]={v:g2.grid[r][c].v/2, pop:true};
      banner('有只奶龙被踩小了一号');
    } else { g2Add(); banner('捣蛋龙扑了空，多掉了一只蛋'); }
  } else if(roll===4){
    g2.circus=true;
    banner('马戏团路过，全体奶龙蹦了一下');
    setTimeout(()=>{ g2.circus=false; },1000);
  } else if(roll===5){
    const occ=[];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(g2.grid[r][c]) occ.push([r,c]);
    if(occ.length){
      const [r,c]=occ[ri(0,occ.length-1)];
      g2.grid[r][c].hiccup=true;
      sfx.hiccup();
      banner('有只奶龙打了个嗝，它自己也很意外');
    } else { g2Add(); banner('奶龙打了个空嗝'); }
  } else if(roll===6){
    sfx.oops();
    banner('什么都没有发生。奶龙们表示很失望。');
  } else if(roll===7){
    let cnt=0;
    for(const row of g2.grid) for(const cc of row) if(cc) cnt++;
    banner('奶龙点名——全场 '+cnt+' 只齐声答：咦哩！');
  } else if(roll===8){
    document.querySelectorAll('#g2board .tile').forEach((t,i)=>{
      t.classList.remove('squish');
      t.style.animationDelay=(i*45)+'ms';
      t.classList.add('circus');
      setTimeout(()=>{ t.classList.remove('circus'); t.style.animationDelay=''; },1200);
    });
    burstCandy(ri(1,2), ri(1,3), 12);
    banner('天降糖霜！全场奶龙开始扭动');
    sfx.shiny();
  } else if(roll===9){
    const occ=[];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(g2.grid[r][c]) occ.push([r,c]);
    if(occ.length>=2){
      const i1=ri(0,occ.length-1); let i2=ri(0,occ.length-1);
      while(i2===i1) i2=ri(0,occ.length-1);
      const [r1,c1]=occ[i1], [r2,c2]=occ[i2];
      const tmp=g2.grid[r1][c1];
      g2.grid[r1][c1]={...g2.grid[r2][c2], pop:true};
      g2.grid[r2][c2]={...tmp, pop:true};
      burstAt(r1,c1,['#ffd76a','#fff'],6); burstAt(r2,c2,['#ffd76a','#fff'],6);
      banner('两只奶龙趁乱换了位置，还装作无事发生');
      sfx.hiccup();
    } else { g2Add(); banner('想换位置，但奶龙不够，先发一只'); }
  } else if(roll===10){
    const occ=[];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(g2.grid[r][c]) occ.push([r,c]);
    if(occ.length){
      const [r,c]=occ[ri(0,occ.length-1)];
      burstCandy(r, c, 6);
      const tiles=document.querySelectorAll('#g2board .tile');
      if(tiles.length){
        const t2=tiles[ri(0,tiles.length-1)];
        t2.classList.remove('flipout'); void t2.offsetWidth; t2.classList.add('flipout');
        setTimeout(()=>t2.classList.remove('flipout'),1400);
      }
      banner('有只奶龙突然装死，大家决定不救它');
      sfx.hiccup();
    } else { g2Add(); banner('想装死，但场上一只奶龙都没有'); }
  } else if(roll===11){
    document.querySelectorAll('#g2board .tile').forEach((t,i)=>{
      t.classList.remove('rollit'); t.style.animationDelay=(i*50)+'ms';
      void t.offsetWidth; t.classList.add('rollit');
      setTimeout(()=>{ t.classList.remove('rollit'); t.style.animationDelay=''; },1500);
    });
    banner('全体奶龙打了个滚，毛都顺了');
  } else if(roll===12){
    const bo=$('blackout'); bo.classList.remove('on'); void bo.offsetWidth; bo.classList.add('on');
    banner('停电了！……哦，来电了。奶龙们毫无反应');
    sfx.oops();
  } else {
    g2.lucky=3;
    banner('接下来三次合成给双倍分');
  }
  if(roll!==5) sfx.event();
}

/* ---------- 结算 ---------- */
function g2OverShow(win){
  $('g2OverTitle').textContent = win?'合出了飞升神奶龙':'没地方挪了';
  $('g2OverScore').textContent=g2.score;
  $('g2OverBest').textContent=g2Best;
  $('g2OverDex').textContent='图鉴 '+TIERS.filter(t=>t.v<=g2Unlock).length+'/'+TIERS.length;
  $('ov-g2-over').classList.add('show');
}

/* ---------- 横幅 / Toast ---------- */
let bannerT=null;
function banner(msg){
  const b=$('banner'); b.textContent=msg; b.classList.add('show');
  clearTimeout(bannerT); bannerT=setTimeout(()=>b.classList.remove('show'),2200);
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.bottom='24px'; },1800);
  setTimeout(()=>t.remove(),2300);
}

/* ---------- 手机适配：棋盘整体缩放（内部坐标保持 456 逻辑像素） ---------- */
function fitBoard(){
  const avail = Math.min(window.innerWidth - 24, 456);
  const k = Math.max(0.4, Math.min(1, avail/456));
  const b=$('g2board'), f=$('g2fit');
  b.style.transform = k<0.999 ? `scale(${k})` : '';
  f.style.width = (456*k)+'px';
  f.style.height = (456*k)+'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', ()=>setTimeout(fitBoard,120));
fitBoard();

/* ---------- 输入 ---------- */
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  audioInit();
  if(e.code==='ArrowUp') g2Move(0,-1);
  if(e.code==='ArrowDown') g2Move(0,1);
  if(e.code==='ArrowLeft') g2Move(-1,0);
  if(e.code==='ArrowRight') g2Move(1,0);
  if(e.code==='KeyR' && !e.repeat) g2New();
});
let g2touch=null;
$('g2board').addEventListener('pointerdown', e=>{ g2touch={x:e.clientX,y:e.clientY}; audioInit(); });
$('g2board').addEventListener('pointerup', e=>{
  if(!g2touch) return;
  const dx=e.clientX-g2touch.x, dy=e.clientY-g2touch.y;
  if(Math.hypot(dx,dy)>24){
    if(Math.abs(dx)>Math.abs(dy)) g2Move(Math.sign(dx),0);
    else g2Move(0,Math.sign(dy));
  }
  g2touch=null;
});

/* ---------- 按钮 ---------- */
$('g2New').onclick=()=>{ audioInit(); g2New(); };
$('g2Again').onclick=()=>g2New();
$('g2Close').onclick=()=>$('ov-g2-over').classList.remove('show');
$('g2Mode').onclick=()=>{
  g2ModeOn=!g2ModeOn;
  localStorage.setItem('nl2_chaos', g2ModeOn?'1':'0');
  $('g2Mode').textContent = g2ModeOn?'乱斗：开':'乱斗：关';
  banner(g2ModeOn?'乱斗已开启':'经典模式');
};
function renderRescue(){ $('g2RescueBtn').textContent = g2RescueOn?'救援：开':'救援：关'; }
$('g2RescueBtn').onclick=()=>{
  g2RescueOn=!g2RescueOn;
  localStorage.setItem('nl2_rescue', g2RescueOn?'1':'0');
  renderRescue();
  banner(g2RescueOn?'救援开着，怎么按都不会输':'救援关了，卡死就重开');
};
renderRescue();
const muteBtn=$('btn-mute');
function renderMute(){ muteBtn.textContent=muted?'音效：关':'音效：开'; }
muteBtn.onclick=()=>{ muted=!muted; localStorage.setItem('nl_mute',muted?'1':'0'); renderMute(); };
renderMute();

/* ---------- 测试钩子（自动化冒烟用，玩家不感知） ---------- */
window.__nl2_state=()=>({score:g2.score, moves:g2.moves, over:g2.over, won:g2.won,
  grid:g2.grid.map(row=>row.map(c=>c?c.v:0)),
  shiny:g2.grid.map(row=>row.map(c=>!!(c&&c.shiny))),
  buff:g2.buff&&g2.buff.id, unlock:g2Unlock, lucky:g2.lucky, maxV:g2.maxV,
  rescues:g2.rescues, rescueOn:g2RescueOn,
  dexGot:TIERS.filter(t=>t.v<=g2Unlock).length});
window.__nl2_move=(dx,dy)=>g2Move(dx,dy);
window.__nl2_new=()=>g2New();
window.__nl2_shiny=()=>{ g2.forceShiny=true; };

/* ---------- 启动 ---------- */
g2BoardInit(); g2New(true); renderDex();   /* 开局静默：祝福横幅留给玩家点“开始”后自己触发 */
/* 发呆彩蛋：10 秒没动静，奶龙开始摸鱼 */
g2.lastAct=Date.now(); g2.idleShown=false;
setInterval(()=>{
  if(!g2 || g2.over) return;
  if(!g2.idleShown && Date.now()-g2.lastAct>10000){
    g2.idleShown=true;
    banner(QUIPS.idle[ri(0,QUIPS.idle.length-1)]);
    tone(240,.3,'sine',.18,80);
  }
},2000);
window.__nl2_chaos=()=>g2Chaos();
/* 预热贴图 */
TIERS.forEach(t=>{ const i=new Image(); i.src=t.img; });
</script>
</body>
